<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Lista de fotógrafos publicados e páginas de portfólio da plataforma."
    />
    <meta property="og:title" content="Fotógrafos | Portfólios Fotográficos" />
    <meta property="og:type" content="website" />
    <title>Fotógrafos | Portfólios Fotográficos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" data-site-header></header>

    <main>
      <section class="section-title section-wrap portfolio-intro" data-portfolio-intro>
        <span>Fotógrafos publicados</span>
        <h1>Explore portfólios profissionais.</h1>
        <p data-directory-count>0 fotógrafos encontrados</p>
      </section>

      <section class="directory-toolbar section-wrap" data-directory-toolbar>
        <form class="directory-search" data-directory-search-form>
          <input data-directory-search type="search" placeholder="Buscar por nome, cidade ou categoria" autocomplete="off" />
          <button type="submit">Buscar</button>
          <button type="button" data-directory-clear>Limpar</button>
        </form>
        <div class="directory-filters" data-directory-filters aria-label="Filtros rápidos"></div>
      </section>

      <section class="portfolio-gallery site-frame" data-album-grid aria-label="Portfolio"></section>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
